<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.23.0/themes/prism.css" />
</head>
<body>
    <div class="code-editor">
        <div class="code-input">
            <div class="line-numbers" id="line-numbers"></div>
            <div id="code-input" style="height: 200px;"></div> <!-- Use a div for Monaco Editor -->
        </div>
        <button id="run-btn">Run Code</button> <!-- Button to execute code -->
        <div class="code-output" id="code-output"></div>
        <div class="error-list" id="error-list"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.23.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jshint/2.12.0/jshint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.21.2/min/vs/loader.js"></script>
    <script src="script.js"></script>
</body>
</html>
